[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "renderdoc-mcp"
version = "0.3.0"
description = "Minimal MCP server for exporting RenderDoc draw textures and VSIn/VSOut mesh data"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
]

[project.scripts]
renderdoc-mcp = "renderdoc_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/renderdoc_mcp"]
